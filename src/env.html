<?xml version="1.0" encoding="UTF-8"?>
<program>
    <struct name="Env" pub="true">
        <field name="sock_path" type="String" pub="true"/>
    </struct>

    <fn name="from_env" pub="true" ret="Env">
        <return>Env {
            sock_path: std::env::var("SOCK").unwrap_or_else(|_| "/run/sock/api.sock".to_string()),
        }</return>
    </fn>
</program>
